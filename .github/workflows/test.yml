name: PowerShell tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pester:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - name: Windows PowerShell 5.1
            engine: powershell.exe
          - name: PowerShell 7
            engine: pwsh.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Analyze and test
        shell: powershell
        run: '& "${{ matrix.engine }}" -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\Invoke-CI.ps1'
